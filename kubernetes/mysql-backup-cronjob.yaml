apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-backup-pvc
  namespace: lamp
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-backup
  namespace: lamp
spec:
  # Run daily at 02:00 AM UTC
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: mysql-backup
              image: mysql:8.0
              command:
                - /bin/sh
                - -c
                - |
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="/backups/mysql_backup_${TIMESTAMP}.sql.gz"
                  echo "Starting MySQL backup at ${TIMESTAMP}..."
                  mysqldump -h mysql -u root -p"${MYSQL_ROOT_PASSWORD}" --all-databases | gzip > "${BACKUP_FILE}"
                  if [ $? -eq 0 ]; then
                    echo "Backup successful: ${BACKUP_FILE}"
                    # Retain backups for 7 days
                    find /backups -name "mysql_backup_*.sql.gz" -mtime +7 -delete
                  else
                    echo "Backup failed!"
                    exit 1
                  fi
              env:
                - name: MYSQL_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: mysql-secret
                      key: MYSQL_ROOT_PASSWORD
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: mysql-backup-pvc
