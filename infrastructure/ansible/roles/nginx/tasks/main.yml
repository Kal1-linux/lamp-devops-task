---
- name: Install Nginx
  apt:
    name: nginx
    state: present

- name: Deploy Nginx site config
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/lamp-app
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable site symlink
  file:
    src: /etc/nginx/sites-available/lamp-app
    dest: /etc/nginx/sites-enabled/lamp-app
    state: link
  notify: Reload nginx

- name: Remove default site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Ensure Nginx is started and enabled
  service:
    name: nginx
    state: started
    enabled: true
